<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
<defs>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020C1B"/>
    <stop offset="65%" stop-color="#041A2E"/>
    <stop offset="100%" stop-color="#062540"/>
  </linearGradient>
  <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0B3D6B"/>
    <stop offset="100%" stop-color="#041226"/>
  </linearGradient>
</defs>

<!-- Sky -->
<rect width="900" height="280" fill="url(#skyGrad)"/>

<!-- Stars -->
<circle cx="45"  cy="22"  r="1"   fill="white" opacity="0.5"/>
<circle cx="130" cy="12"  r="1.5" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="240" cy="35"  r="1"   fill="white" opacity="0.4"/>
<circle cx="370" cy="18"  r="1.5" fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
<circle cx="510" cy="28"  r="1"   fill="white" opacity="0.5"/>
<circle cx="620" cy="10"  r="1"   fill="white" opacity="0.4"><animate attributeName="opacity" values="0.4;0.9;0.4" dur="2.2s" repeatCount="indefinite"/></circle>
<circle cx="730" cy="40"  r="1.5" fill="white" opacity="0.3"/>
<circle cx="820" cy="20"  r="1"   fill="white" opacity="0.6"/>
<circle cx="875" cy="50"  r="1"   fill="white" opacity="0.3"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="180" cy="55"  r="1"   fill="white" opacity="0.2"/>
<circle cx="680" cy="55"  r="1"   fill="white" opacity="0.4"/>

<!-- Subtle light rays from above -->
<line x1="180" y1="0" x2="120" y2="160" stroke="white" stroke-width="28" opacity="0.025">
  <animate attributeName="opacity" values="0.02;0.05;0.02" dur="5s" repeatCount="indefinite"/>
</line>
<line x1="400" y1="0" x2="370" y2="160" stroke="white" stroke-width="22" opacity="0.02">
  <animate attributeName="opacity" values="0.015;0.04;0.015" dur="4s" repeatCount="indefinite"/>
</line>
<line x1="620" y1="0" x2="660" y2="160" stroke="white" stroke-width="25" opacity="0.025">
  <animate attributeName="opacity" values="0.02;0.05;0.02" dur="6s" repeatCount="indefinite"/>
</line>
<line x1="800" y1="0" x2="850" y2="160" stroke="white" stroke-width="18" opacity="0.02">
  <animate attributeName="opacity" values="0.015;0.035;0.015" dur="3.5s" repeatCount="indefinite"/>
</line>

<!-- Name -->
<text x="450" y="82" text-anchor="middle"
  font-family="system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"
  font-size="46" font-weight="700" fill="white" letter-spacing="2" opacity="0.95">Kaivalya Singh</text>

<!-- Subtitle -->
<text x="450" y="114" text-anchor="middle"
  font-family="Courier New,Courier,monospace"
  font-size="12" fill="#64FFDA" letter-spacing="5" opacity="0.9">QUANTUM ML  ·  RL RESEARCH  ·  COMPUTER VISION</text>

<!-- Decorative line under subtitle -->
<line x1="270" y1="128" x2="630" y2="128" stroke="#38BDF8" stroke-width="1" opacity="0.4"/>

<!-- Water body that fills up from below -->
<rect x="0" y="280" width="900" height="0" fill="url(#waterGrad)">
  <animate attributeName="y"      from="280" to="156" dur="2.2s" fill="freeze" begin="0s"/>
  <animate attributeName="height" from="0"   to="124" dur="2.2s" fill="freeze" begin="0s"/>
</rect>

<!-- Wave surface 1 — appears after fill -->
<path d="M0,280 L900,280 Z" fill="#1E90C8" opacity="0.55">
  <animate attributeName="d" begin="2.2s" dur="3.2s" repeatCount="indefinite"
    values="M0,156 Q225,143 450,156 Q675,169 900,156 L900,280 L0,280 Z;
            M0,162 Q225,149 450,162 Q675,175 900,162 L900,280 L0,280 Z;
            M0,156 Q225,143 450,156 Q675,169 900,156 L900,280 L0,280 Z"/>
</path>

<!-- Wave surface 2 — lighter, offset timing -->
<path d="M0,280 L900,280 Z" fill="#38BDF8" opacity="0.25">
  <animate attributeName="d" begin="2.2s" dur="2.6s" repeatCount="indefinite"
    values="M0,159 Q150,148 300,159 Q450,170 600,159 Q750,148 900,159 L900,280 L0,280 Z;
            M0,154 Q150,163 300,154 Q450,145 600,154 Q750,163 900,154 L900,280 L0,280 Z;
            M0,159 Q150,148 300,159 Q450,170 600,159 Q750,148 900,159 L900,280 L0,280 Z"/>
</path>

<!-- ===== FISH ===== -->

<!-- Fish 1: Large teal, right-to-left, y=178 -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="980,178" to="-100,178" dur="14s" begin="2.4s" repeatCount="indefinite"/>
  <!-- left-facing body -->
  <path d="M0,0 C-5,-9 -22,-9 -28,0 C-22,9 -5,9 0,0" fill="#64FFDA" opacity="0.88"/>
  <!-- tail on right -->
  <path d="M0,0 L14,-10 L14,10 Z" fill="#34D399" opacity="0.9"/>
  <!-- dorsal fin -->
  <path d="M-10,-9 L-6,-18 L-2,-9" fill="#34D399" opacity="0.65"/>
  <!-- eye -->
  <circle cx="-22" cy="-3" r="2.5" fill="#041226"/>
  <circle cx="-23" cy="-3.5" r="0.8" fill="white" opacity="0.6"/>
</g>

<!-- Fish 2: Medium sky-blue, left-to-right, y=205 -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="-100,205" to="980,205" dur="17s" begin="3.5s" repeatCount="indefinite"/>
  <!-- right-facing body -->
  <path d="M0,0 C5,-7 20,-7 26,0 C20,7 5,7 0,0" fill="#38BDF8" opacity="0.85"/>
  <!-- tail on left -->
  <path d="M0,0 L-12,-9 L-12,9 Z" fill="#0EA5E9" opacity="0.9"/>
  <!-- dorsal fin -->
  <path d="M8,-7 L12,-15 L17,-7" fill="#0EA5E9" opacity="0.6"/>
  <!-- eye -->
  <circle cx="19" cy="-2" r="2" fill="#041226"/>
  <circle cx="18" cy="-2.5" r="0.7" fill="white" opacity="0.6"/>
</g>

<!-- Fish 3: Small emerald, right-to-left, y=230 -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="980,230" to="-80,230" dur="10s" begin="4s" repeatCount="indefinite"/>
  <path d="M0,0 C-3,-6 -15,-6 -19,0 C-15,6 -3,6 0,0" fill="#34D399" opacity="0.85"/>
  <path d="M0,0 L9,-7 L9,7 Z" fill="#10B981" opacity="0.9"/>
  <circle cx="-14" cy="-2" r="1.8" fill="#041226"/>
  <circle cx="-15" cy="-2.5" r="0.6" fill="white" opacity="0.5"/>
</g>

<!-- Fish 4: Tiny cyan, left-to-right, y=218 -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="-80,218" to="980,218" dur="11s" begin="5.5s" repeatCount="indefinite"/>
  <path d="M0,0 C3,-5 14,-5 18,0 C14,5 3,5 0,0" fill="#06B6D4" opacity="0.8"/>
  <path d="M0,0 L-9,-6 L-9,6 Z" fill="#0891B2" opacity="0.9"/>
  <circle cx="13" cy="-1.5" r="1.5" fill="#041226"/>
</g>

<!-- Fish 5: Medium lavender-blue, right-to-left, y=250 -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="980,250" to="-100,250" dur="16s" begin="2.8s" repeatCount="indefinite"/>
  <path d="M0,0 C-4,-8 -19,-8 -24,0 C-19,8 -4,8 0,0" fill="#7DD3FC" opacity="0.82"/>
  <path d="M0,0 L12,-9 L12,9 Z" fill="#38BDF8" opacity="0.88"/>
  <path d="M-8,-8 L-5,-16 L-1,-8" fill="#38BDF8" opacity="0.55"/>
  <circle cx="-18" cy="-2.5" r="2.2" fill="#041226"/>
  <circle cx="-19" cy="-3" r="0.7" fill="white" opacity="0.5"/>
</g>

<!-- Fish 6: Tiny teal, left-to-right, y=192 (near surface) -->
<g>
  <animateTransform attributeName="transform" type="translate"
    from="-60,192" to="980,192" dur="22s" begin="6s" repeatCount="indefinite"/>
  <path d="M0,0 C2,-4 11,-4 14,0 C11,4 2,4 0,0" fill="#64FFDA" opacity="0.75"/>
  <path d="M0,0 L-7,-5 L-7,5 Z" fill="#34D399" opacity="0.85"/>
  <circle cx="10" cy="-1" r="1.3" fill="#041226"/>
</g>

<!-- ===== BUBBLES ===== -->
<circle cx="90"  cy="280" r="3"   fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="7s"   repeatCount="indefinite" begin="2.8s"/>
  <animate attributeName="opacity" values="0;0.22;0.22;0"  dur="7s"   repeatCount="indefinite" begin="2.8s"/>
</circle>
<circle cx="220" cy="280" r="2"   fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="5s"   repeatCount="indefinite" begin="3.5s"/>
  <animate attributeName="opacity" values="0;0.18;0.18;0"  dur="5s"   repeatCount="indefinite" begin="3.5s"/>
</circle>
<circle cx="380" cy="280" r="3.5" fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="9s"   repeatCount="indefinite" begin="2.3s"/>
  <animate attributeName="opacity" values="0;0.2;0.2;0"   dur="9s"   repeatCount="indefinite" begin="2.3s"/>
</circle>
<circle cx="530" cy="280" r="2.5" fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="6s"   repeatCount="indefinite" begin="4.2s"/>
  <animate attributeName="opacity" values="0;0.2;0.2;0"   dur="6s"   repeatCount="indefinite" begin="4.2s"/>
</circle>
<circle cx="680" cy="280" r="2"   fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="8s"   repeatCount="indefinite" begin="3s"/>
  <animate attributeName="opacity" values="0;0.15;0.15;0" dur="8s"   repeatCount="indefinite" begin="3s"/>
</circle>
<circle cx="800" cy="280" r="3"   fill="white" opacity="0">
  <animate attributeName="cy"      values="270;158" dur="5.5s" repeatCount="indefinite" begin="5s"/>
  <animate attributeName="opacity" values="0;0.22;0.22;0"  dur="5.5s" repeatCount="indefinite" begin="5s"/>
</circle>

</svg>